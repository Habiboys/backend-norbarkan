services:
  sidecar:
    build: ./sidecar
    ports:
      - "5001:5000"
    volumes:
      - ./storage:/app/storage
    environment:
      SIDECAR_PORT: 5000
      STORAGE_PATH: /app/storage/cache/external
      DOWNLOAD_TIMEOUT: 600
    restart: unless-stopped

  backend:
    build: .
    network_mode: host
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env
    env_file:
      - ./.env
    depends_on:
      sidecar:
        condition: service_started
    restart: unless-stopped
